<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{color-scheme:dark;--bg:#07090f;--panel:#0b101ae8;--line:#29334a;--text:#eef3ff;--muted:#8490aa;--accent:#67e8f9;--violet:#a78bfa;--danger:#fb7185}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 70% 10%,#15132e 0,#080b12 38%,#05070b 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(#6670850c 1px,transparent 1px),linear-gradient(90deg,#6670850c 1px,transparent 1px);background-size:34px 34px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}header{display:flex;align-items:center;gap:18px;padding:16px 20px 11px;z-index:5;background:linear-gradient(#070910f5,#070910a8,transparent)}.brand{min-width:195px}.eyebrow{font:600 10px/1.2 ui-monospace,monospace;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}.brand h1{font-size:18px;letter-spacing:-.025em;margin:3px 0 0}.tabs{display:flex;gap:6px;align-items:center;overflow:auto;padding:2px}.tab{appearance:none;border:1px solid #242c3d;background:#0c1019c4;color:#96a1b8;border-radius:9px;padding:8px 11px;font:600 10px/1 ui-monospace,monospace;letter-spacing:.03em;cursor:pointer;transition:.2s;white-space:nowrap}.tab:hover{color:#fff;border-color:#4d5a74;transform:translateY(-1px)}.tab.active{color:#071016;background:var(--accent);border-color:var(--accent);box-shadow:0 0 24px #67e8f938}.tab.stack{color:#d8cfff;border-color:#67549a;background:#171126}.tab.stack.active{background:var(--violet);border-color:var(--violet);color:#0c0815}.hint{margin-left:auto;font-size:11px;color:#667189;white-space:nowrap}
main{position:relative;min-height:0}canvas{display:block;width:100%;height:100%;cursor:grab;transition:opacity .2s}canvas.drag{cursor:grabbing}.overlay{position:absolute;pointer-events:none;z-index:2}.viewtitle{left:14px;top:0;width:min(520px,70vw);padding:8px 95px 20px 10px;background:linear-gradient(90deg,#070a10f2 0,#070a10d2 72%,transparent)}.viewtitle h2{margin:0;font-size:27px;letter-spacing:-.04em}.viewtitle p{margin:5px 0;color:var(--muted);font-size:12px;max-width:450px}.badge{display:inline-flex;margin-top:8px;padding:5px 8px;border:1px solid #293248;background:#0b0f18bb;border-radius:999px;color:#9ca8bf;font:10px ui-monospace,monospace}.tooltip{display:none;max-width:330px;padding:9px 11px;border:1px solid #34405a;background:#090d16f4;box-shadow:0 12px 40px #0009;border-radius:9px;font-size:12px;line-height:1.45;backdrop-filter:blur(10px)}.tooltip b{display:block;color:#fff}.tooltip small{color:var(--muted)}
.legend{right:18px;bottom:15px;padding:11px 13px;border:1px solid #20283a;border-radius:12px;background:#090d16df;box-shadow:0 10px 40px #0005;backdrop-filter:blur(12px);max-width:270px}.legend-title{font:600 9px ui-monospace,monospace;color:#717d96;letter-spacing:.14em;margin-bottom:7px}.legend-items{display:grid;grid-template-columns:repeat(2,auto);gap:6px 13px;font-size:10px;color:#a4aec0}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}.ring{display:inline-block;width:9px;height:9px;border:2px solid var(--danger);border-radius:50%;margin-right:6px;vertical-align:-1px}.arrow{color:#8ea0be;margin-right:5px}

@media(max-width:850px){header{gap:8px;align-items:flex-start;padding:11px 10px 8px}.brand{min-width:125px}.brand h1{font-size:15px}.hint{display:none}.tabs{flex-wrap:nowrap}.viewtitle{width:88vw}.viewtitle h2{font-size:21px}.legend{display:none}#inspector{position:fixed;left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:42vh;transform:translateY(calc(100% + 20px));border-radius:15px}#inspector.open{transform:translateY(0)}footer{padding:0 10px}.credit{display:none}#stats{gap:11px;font-size:9px}}
</style></head><body><div id="app"><header><div class="brand"><div class="eyebrow">Architecture atlas</div><h1>price-checker</h1></div><nav class="tabs" id="tabs"></nav><div class="hint" id="hint"></div></header><main><canvas id="canvas"></canvas><div class="overlay viewtitle"><h2 id="title"></h2><p id="subtitle"></p><span class="badge" id="modeBadge"></span></div><div class="overlay tooltip" id="tooltip"></div><div class="overlay legend"><div class="legend-title">SIGNAL KEY</div><div class="legend-items" id="legend"></div></div><aside id="inspector"><div class="ins-head"><div class="ins-kind" id="insKind"></div><h3 id="insTitle"></h3><button class="ins-close" id="insClose">×</button></div><div class="ins-body" id="insBody"></div></aside></main><footer><div id="stats"></div><div class="credit">heuristic static scan · offline artifact</div></footer></div>
<script id="graph-data" type="application/json">__GRAPH_DATA__</script>
<script>
(()=>{'use strict';
const graph=JSON.parse(document.getElementById('graph-data').textContent),slices=graph.slices,bySlice=new Map(slices.map(s=>[s.id,s]));
const C={workspace:'#67e8f9','source file':'#7dd3fc','test file':'#c4b5fd',route:'#fbbf24','env var':'#fb7185','config file':'#34d399','http host':'#f97316','external api':'#f97316',retailer:'#f59e0b',marketplace:'#f43f5e',database:'#22c55e',default:'#94a3b8'};
const packagePalette=['#22d3ee','#a78bfa','#34d399','#f59e0b','#fb7185','#60a5fa','#f472b6','#a3e635','#fb923c','#2dd4bf','#818cf8'];
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),tabs=$('tabs'),tooltip=$('tooltip'),title=$('title'),subtitle=$('subtitle'),badge=$('modeBadge'),stats=$('stats'),hint=$('hint'),legend=$('legend'),inspector=$('inspector');
let W=0,H=0,dpr=1,mode='stack',active=null,hover=null,selected=null,drag=null,fade=1,hitAreas=[],pinch=null;
let camera={x:0,y:0,z:1},stackCam={yaw:-.58,pitch:.64,zoom:1},mouse={x:0,y:0};
const desc={packages:'Dependency hierarchy: consumers above, dependencies below.',files:'Import graph clustered into package neighborhoods.',api:'Routes flow left to right through handlers and touched systems.',config:'Environment variables by referencing file. Filled cells are reads.',tests:'Tests on the left, production files on the right. Red means no direct test edge.',external:'Remote systems on the left and the files that reference them on the right.'};
const badges={packages:'DEPENDENCY FLOW',files:'CLUSTERED FORCE MAP',api:'REQUEST FLOW',config:'REFERENCE MATRIX',tests:'COVERAGE MAP',external:'SYSTEM BIPARTITE'};
const legends={packages:[['workspace','workspace'],['arrow','depends on'],['ring','orphan']],files:[['source file','source'],['test file','test'],['cluster','package hull'],['arrow','imports']],api:[['route','route'],['source file','handler/module'],['external api','external'],['arrow','flows to']],config:[['env var','environment variable'],['source file','consumer'],['config file','manifest / empty'],['cell','reference cell']],tests:[['test file','test'],['source file','covered source'],['danger','uncovered source'],['arrow','imports']],external:[['external api','external system'],['source file','referencing file'],['arrow','references']]};
const allNodes=new Map();slices.forEach(s=>s.nodes.forEach(n=>{if(!allNodes.has(n.id))allNodes.set(n.id,n)}));
const appearances=new Map();slices.forEach(s=>s.nodes.forEach(n=>{if(!appearances.has(n.id))appearances.set(n.id,[]);appearances.get(n.id).push(s.id)}));
const packageOf=new Map(graph.crosslinks.map(e=>[e.source,e.target]));const packageIds=[...new Set(graph.crosslinks.map(e=>e.target))];const packageColor=new Map(packageIds.map((id,i)=>[id,packagePalette[i%packagePalette.length]]));
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}
function statsFor(s){const d=new Map(s.nodes.map(n=>[n.id,0]));s.edges.forEach(e=>{d.set(e.source,(d.get(e.source)||0)+1);d.set(e.target,(d.get(e.target)||0)+1)});return{nodes:s.nodes.length,edges:s.edges.length,orphans:[...d.values()].filter(v=>!v).length,degree:d}}
const sliceStats=new Map(slices.map(s=>[s.id,statsFor(s)]));
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();
function world(p){return{x:W/2+(p.x+camera.x)*camera.z,y:H/2+(p.y+camera.y)*camera.z}}
function addHit(node,x,y,r=10,extra={}){hitAreas.push({node,x,y,r,...extra})}
function line(a,b,color='#53617a66',width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function arrow(a,b,color='#71829d88',width=1.2,elbow=false){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a.x,a.y);if(elbow){const m=(a.y+b.y)/2;ctx.bezierCurveTo(a.x,m,b.x,m,b.x,b.y)}else ctx.lineTo(b.x,b.y);ctx.stroke();const ang=Math.atan2(b.y-a.y,b.x-a.x),r=5;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-Math.cos(ang-.55)*r,b.y-Math.sin(ang-.55)*r);ctx.lineTo(b.x-Math.cos(ang+.55)*r,b.y-Math.sin(ang+.55)*r);ctx.closePath();ctx.fill()}
function rr(x,y,w,h,r=8){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function tail(s,n=32){return s.length>n?'…'+s.slice(-n):s}
function nodeGlyph(n,p,opt={}){const col=opt.color||C[n.kind]||C.default,r=opt.r||5,deg=opt.degree??1,isSel=selected?.id===n.id,isHover=hover?.id===n.id,dim=selected&&!isSel&&!opt.linked;ctx.globalAlpha=dim?.18:1;if(!deg){ctx.strokeStyle=opt.uncovered?'#fb923c':'#fb7185';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,r+5,0,Math.PI*2);ctx.stroke()}ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=isHover?18:6;ctx.beginPath();ctx.arc(p.x,p.y,isHover?r+2:r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;addHit(n,p.x,p.y,Math.max(10,r+4))}
function label(n,p,opt={}){if(camera.z<.58&&!opt.force)return;const alpha=Math.min(1,Math.max(0,(camera.z-.52)/.55));ctx.globalAlpha=opt.force?1:alpha;ctx.font=`${opt.bold?'600':'500'} ${opt.size||10}px ui-monospace,monospace`;ctx.fillStyle=opt.color||'#dce6f7';ctx.textAlign=opt.align||'left';ctx.fillText(opt.text||tail(n.label,camera.z>1.45?48:28),p.x+(opt.dx||0),p.y+(opt.dy||0));if(opt.secondary&&camera.z>1.35){ctx.font='9px ui-monospace,monospace';ctx.fillStyle='#75839a';ctx.fillText(opt.secondary,p.x+(opt.dx||0),p.y+(opt.dy||0)+13)}ctx.textAlign='left';ctx.globalAlpha=1}
function renderLegend(id){legend.innerHTML=(legends[id]||[]).map(([k,v])=>k==='arrow'?`<span><i class=arrow>→</i>${v}</span>`:k==='ring'?`<span><i class=ring></i>${v}</span>`:k==='cluster'?`<span><i class=dot style="background:#a78bfa55;border:1px solid #a78bfa"></i>${v}</span>`:k==='cell'?`<span><i class=dot style="border-radius:2px;background:#67e8f9"></i>${v}</span>`:k==='danger'?`<span><i class=dot style="background:#fb923c"></i>${v}</span>`:`<span><i class=dot style="background:${C[k]||C.default}"></i>${v}</span>`).join('')}
function transition(fn){fade=0;canvas.style.opacity='.14';setTimeout(()=>{fn();hover=null;fade=1;canvas.style.opacity='1'},130)}
function setMode(id){transition(()=>{mode=id;active=bySlice.get(id)||null;selected=null;closeInspector();camera={x:0,y:20,z:id==='config'?.8:id==='files'?.82:1};document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.id===id));if(id==='stack'){title.textContent='Layer stack';subtitle.textContent='Six concerns. Shared entities pierce layers as luminous bridges.';badge.textContent='MACRO VIEW';hint.textContent='drag to rotate · wheel to zoom · click a plane';renderLegend('files')}else{title.textContent=active.name;subtitle.textContent=desc[id];badge.textContent=badges[id];hint.textContent='drag to pan · wheel to zoom · tap a node for details';renderLegend(id)}updateStats()})}
function updateStats(){if(mode==='stack'){stats.innerHTML=`<span class=stat><strong>${slices.length}</strong> layers</span><span class=stat><strong>${slices.reduce((a,s)=>a+s.nodes.length,0)}</strong> appearances</span><span class=stat><strong>${graph.crosslinks.length}</strong> containment links</span>`;return}const st=sliceStats.get(active.id);let extra=active.id==='tests'?`<span class=stat><strong>${active.nodes.filter(n=>n.kind==='source file'&&!st.degree.get(n.id)).length}</strong> uncovered</span>`:'';stats.innerHTML=`<span class=stat><strong>${st.nodes}</strong> nodes</span><span class=stat><strong>${st.edges}</strong> edges</span><span class=stat><strong>${st.orphans}</strong> orphans</span>${extra}<span class=stat><strong>${camera.z.toFixed(2)}×</strong> zoom</span>`}
const sb=document.createElement('button');sb.className='tab stack';sb.dataset.id='stack';sb.textContent='STACK';sb.onclick=()=>setMode('stack');tabs.append(sb);slices.forEach(s=>{const b=document.createElement('button');b.className='tab';b.dataset.id=s.id;b.textContent=s.name.toUpperCase();b.onclick=()=>setMode(s.id);tabs.append(b)});
// Static layered package positions
function layered(nodes,edges,vertical=true){const rank=new Map(nodes.map(n=>[n.id,0]));for(let k=0;k<nodes.length;k++){let changed=false;for(const e of edges){const v=Math.min(nodes.length-1,(rank.get(e.target)||0)+1);if(v>(rank.get(e.source)||0)){rank.set(e.source,v);changed=true}}if(!changed)break}const groups=new Map();nodes.forEach(n=>{const r=rank.get(n.id)||0;if(!groups.has(r))groups.set(r,[]);groups.get(r).push(n)});const pos=new Map(),rs=[...groups.keys()].sort((a,b)=>b-a);rs.forEach((r,li)=>{const a=groups.get(r).sort((x,y)=>x.label.localeCompare(y.label));a.forEach((n,i)=>pos.set(n.id,vertical?{x:(i-(a.length-1)/2)*170,y:(li-(rs.length-1)/2)*125}:{x:(li-(rs.length-1)/2)*240,y:(i-(a.length-1)/2)*72}))});return pos}
const packagePos=layered(bySlice.get('packages').nodes,bySlice.get('packages').edges,true);
function drawPackages(){const s=active,st=sliceStats.get(s.id),pos=packagePos;for(const e of s.edges){const a=world(pos.get(e.source)),b=world(pos.get(e.target));arrow({x:a.x,y:a.y+16},{x:b.x,y:b.y-16},selected&&(selected.id===e.source||selected.id===e.target)?'#dffaff':'#60728f99',selected?1.5:1.1,true)}for(const n of s.nodes){const p=world(pos.get(n.id)),deg=st.degree.get(n.id)||0,w=Math.max(90,Math.min(175,n.label.length*7+28))*camera.z,h=32*camera.z;ctx.fillStyle=selected?.id===n.id?'#17405a':'#101a28';ctx.strokeStyle=deg?'#3b6377':'#fb7185';ctx.lineWidth=selected?.id===n.id?2:1;rr(p.x-w/2,p.y-h/2,w,h,8);ctx.fill();ctx.stroke();addHit(n,p.x,p.y,Math.max(17,w/2),{box:{w,h}});if(camera.z>.48){ctx.textAlign='center';ctx.fillStyle='#e9f8ff';ctx.font=`600 ${Math.max(8,11*camera.z)}px ui-monospace,monospace`;ctx.fillText(tail(n.label,camera.z>1.2?30:20),p.x,p.y+4);ctx.textAlign='left'}}}
// Clustered force simulation
function makeFileSim(){const s=bySlice.get('files'),nodes=s.nodes.map((n,i)=>{const pkg=packageOf.get(n.id)||'package:unknown',pi=Math.max(0,packageIds.indexOf(pkg)),a=pi/packageIds.length*Math.PI*2,cx=Math.cos(a)*260,cy=Math.sin(a)*190,j=(hash(n.id)%6283)/1000;return{...n,pkg,x:cx+Math.cos(j)*45,y:cy+Math.sin(j)*45,vx:0,vy:0}}),by=new Map(nodes.map(n=>[n.id,n]));return{nodes,by,edges:s.edges.map(e=>({a:by.get(e.source),b:by.get(e.target),...e})).filter(e=>e.a&&e.b),temp:1}}
const fileSim=makeFileSim();
function simulateFiles(){if(fileSim.temp<.006)return;const n=fileSim.nodes,centers=new Map();for(const [pi,id] of packageIds.entries()){const a=pi/packageIds.length*Math.PI*2;centers.set(id,{x:Math.cos(a)*280,y:Math.sin(a)*205})}for(let i=0;i<n.length;i++){const p=n[i],c=centers.get(p.pkg)||{x:0,y:0};p.vx+=(c.x-p.x)*.0025;p.vy+=(c.y-p.y)*.0025;for(let j=i+1;j<n.length;j++){let q=n[j],dx=p.x-q.x,dy=p.y-q.y,d2=dx*dx+dy*dy+2,f=Math.min(720/d2,.7);p.vx+=dx*f;q.vx-=dx*f;p.vy+=dy*f;q.vy-=dy*f}}for(const e of fileSim.edges){let dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.hypot(dx,dy)||1,f=(d-58)*.006;e.a.vx+=dx/d*f;e.a.vy+=dy/d*f;e.b.vx-=dx/d*f;e.b.vy-=dy/d*f}for(const p of n){p.vx*=.82;p.vy*=.82;p.x+=p.vx*fileSim.temp;p.y+=p.vy*fileSim.temp}fileSim.temp*=.994}
function hull(points){if(points.length<3)return points;const ps=[...points].sort((a,b)=>a.x-b.x||a.y-b.y),cross=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x),lo=[],up=[];for(const p of ps){while(lo.length>1&&cross(lo.at(-2),lo.at(-1),p)<=0)lo.pop();lo.push(p)}for(const p of ps.toReversed()){while(up.length>1&&cross(up.at(-2),up.at(-1),p)<=0)up.pop();up.push(p)}return lo.slice(0,-1).concat(up.slice(0,-1))}
function drawFiles(){simulateFiles();const st=sliceStats.get('files'),groups=new Map();fileSim.nodes.forEach(n=>{if(!groups.has(n.pkg))groups.set(n.pkg,[]);groups.get(n.pkg).push(world(n))});for(const [pkg,pts] of groups){const h=hull(pts.map(p=>({x:p.x+(p.x<W/2?-15:15),y:p.y+(p.y<H/2?-15:15)})));if(h.length>2){ctx.beginPath();h.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();const col=packageColor.get(pkg)||'#64748b';ctx.fillStyle=col+'18';ctx.strokeStyle=col+'66';ctx.lineWidth=1;ctx.fill();ctx.stroke();const top=h.reduce((a,p)=>p.y<a.y?p:a,h[0]);ctx.fillStyle=col;ctx.font='600 10px ui-monospace,monospace';ctx.fillText((allNodes.get(pkg)?.label)||pkg.replace('package:',''),top.x,top.y-7)}}for(const e of fileSim.edges){const a=world(e.a),b=world(e.b),lit=selected&&(selected.id===e.a.id||selected.id===e.b.id);arrow(a,b,lit?'#e8f8ffcc':'#53617a4d',lit?1.7:1)}const canLabel=camera.z>.72&&fileSim.nodes.length<110;for(const n of fileSim.nodes){const p=world(n),linked=selected&&fileSim.edges.some(e=>(e.a.id===selected.id&&e.b.id===n.id)||(e.b.id===selected.id&&e.a.id===n.id));nodeGlyph(n,p,{degree:st.degree.get(n.id)||0,color:packageColor.get(n.pkg),linked});if(canLabel&&(camera.z>1.02||hover?.id===n.id||selected?.id===n.id))label(n,p,{dx:10,dy:3,secondary:n.pkg.replace('package:','')})}}
function drawBipartite(id,leftKinds,rightKinds,opt={}){const s=active,st=sliceStats.get(id),left=s.nodes.filter(n=>leftKinds.includes(n.kind)).sort((a,b)=>a.label.localeCompare(b.label)),right=s.nodes.filter(n=>rightKinds.includes(n.kind)).sort((a,b)=>a.label.localeCompare(b.label));const gap=Math.max(24,Math.min(49,620/Math.max(left.length,right.length,1))),lp=new Map(left.map((n,i)=>[n.id,{x:-330,y:(i-(left.length-1)/2)*gap}])),rp=new Map(right.map((n,i)=>[n.id,{x:330,y:(i-(right.length-1)/2)*gap}]));ctx.font='700 10px ui-monospace,monospace';ctx.fillStyle='#75839b';for(const [x,t] of [[-330,opt.leftTitle||'LEFT'],[330,opt.rightTitle||'RIGHT']]){const p=world({x,y:-Math.max(left.length,right.length)*gap/2-35});ctx.textAlign=x<0?'left':'right';ctx.fillText(t,p.x,p.y)}for(const e of s.edges){if(!lp.has(e.source)||!rp.has(e.target))continue;const a=world(lp.get(e.source)),b=world(rp.get(e.target)),lit=selected&&(selected.id===e.source||selected.id===e.target);arrow(a,b,lit?'#eaf8ffdd':'#53617a4c',lit?1.8:1)}for(const [arr,pos,side] of [[left,lp,'left'],[right,rp,'right']])for(const n of arr){const p=world(pos.get(n.id)),deg=st.degree.get(n.id)||0,unc=opt.uncovered&&side==='right'&&!deg;nodeGlyph(n,p,{degree:deg,uncovered:unc,color:unc?'#fb923c':C[n.kind]});if(camera.z>.48&&(arr.length<70||camera.z>.9||hover?.id===n.id)){label(n,p,{dx:side==='left'?10:-10,dy:3,align:side==='left'?'left':'right',color:unc?'#fdba74':'#dce6f7',secondary:camera.z>1.3?`${deg} direct link${deg===1?'':'s'}`:''})}}ctx.textAlign='left'}
function apiGraph(){const api=bySlice.get('api'),files=bySlice.get('files'),ext=bySlice.get('external'),routes=api.nodes.filter(n=>n.kind==='route'),handlerIds=new Set(api.edges.map(e=>e.target)),handlers=api.nodes.filter(n=>handlerIds.has(n.id)),moduleIds=new Set(),edges=[...api.edges.map(e=>({...e,type:'route'}))];for(const e of files.edges)if(handlerIds.has(e.source)){moduleIds.add(e.target);edges.push({...e,type:'module'})}for(const e of ext.edges)if(handlerIds.has(e.target)){moduleIds.add(e.source);edges.push({source:e.target,target:e.source,type:'external'})}const modules=[...moduleIds].map(id=>allNodes.get(id)).filter(Boolean);return{nodes:[...routes,...handlers,...modules],routes,handlers,modules,edges}}
const apiView=apiGraph();
function drawApi(){const cols=[apiView.routes,apiView.handlers,apiView.modules],xs=[-380,-40,340],pos=new Map();cols.forEach((arr,c)=>arr.sort((a,b)=>a.label.localeCompare(b.label)).forEach((n,i)=>pos.set(n.id,{x:xs[c],y:(i-(arr.length-1)/2)*58})));for(const e of apiView.edges){if(!pos.has(e.source)||!pos.has(e.target))continue;const a=world(pos.get(e.source)),b=world(pos.get(e.target));arrow(a,b,selected&&(selected.id===e.source||selected.id===e.target)?'#fff':'#63738f72',selected?1.7:1.1)}['ROUTES','HANDLERS','TOUCHED MODULES / SYSTEMS'].forEach((t,i)=>{const p=world({x:xs[i],y:-Math.max(3,cols[i].length)*29-40});ctx.textAlign='center';ctx.fillStyle='#75839b';ctx.font='700 10px ui-monospace,monospace';ctx.fillText(t,p.x,p.y)});for(const n of apiView.nodes){const p=world(pos.get(n.id));nodeGlyph(n,p,{degree:apiView.edges.filter(e=>e.source===n.id||e.target===n.id).length});label(n,p,{dx:0,dy:18,align:'center',force:camera.z>.63,secondary:n.kind})}ctx.textAlign='left'}
function drawConfig(){const s=active,envs=s.nodes.filter(n=>n.kind==='env var').sort((a,b)=>a.label.localeCompare(b.label)),targets=[...new Map(s.edges.filter(e=>e.source.startsWith('env:')).map(e=>[e.target,allNodes.get(e.target)])).values()].filter(Boolean).sort((a,b)=>a.label.localeCompare(b.label)),manifests=s.nodes.filter(n=>n.kind==='config file'&&!targets.some(x=>x.id===n.id));const links=new Set(s.edges.map(e=>e.source+'\0'+e.target)),cw=27,rh=23,x0=-targets.length*cw/2,y0=-envs.length*rh/2;ctx.save();for(let i=0;i<envs.length;i++){const y=y0+i*rh,p=world({x:x0-8,y});if(camera.z>.46){ctx.textAlign='right';ctx.font='9px ui-monospace,monospace';ctx.fillStyle=selected?.id===envs[i].id?'#fff':'#d7a2b0';ctx.fillText(tail(envs[i].label,25),p.x,p.y+3)}addHit(envs[i],p.x-50,p.y,55)}for(let j=0;j<targets.length;j++){const x=x0+j*cw,p=world({x,y:y0-12});if(camera.z>.65){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-Math.PI/3);ctx.font='9px ui-monospace,monospace';ctx.fillStyle=selected?.id===targets[j].id?'#fff':'#90a0b9';ctx.fillText(tail(targets[j].label,27),0,0);ctx.restore()}addHit(targets[j],p.x,p.y-30,34)}for(let i=0;i<envs.length;i++)for(let j=0;j<targets.length;j++){const p=world({x:x0+j*cw,y:y0+i*rh}),on=links.has(envs[i].id+'\0'+targets[j].id),sel=selected&&(selected.id===envs[i].id||selected.id===targets[j].id);ctx.fillStyle=on?(sel?'#eafcff':'#67e8f9'):'#182131';ctx.globalAlpha=on?1:.32;ctx.fillRect(p.x-3*camera.z,p.y-3*camera.z,6*camera.z,6*camera.z);ctx.globalAlpha=1;if(on)addHit(envs[i],p.x,p.y,7,{connection:targets[j]})}ctx.textAlign='left';if(manifests.length){const py=world({x:0,y:y0+envs.length*rh+45});ctx.fillStyle='#66738a';ctx.font='700 9px ui-monospace,monospace';ctx.fillText('MANIFESTS WITHOUT ENV-READ CELLS',world({x:x0,y:0}).x,py.y);manifests.forEach((n,i)=>{const p=world({x:x0+(i%8)*125,y:y0+envs.length*rh+70+Math.floor(i/8)*28});ctx.fillStyle='#141d29';ctx.strokeStyle='#334155';rr(p.x,p.y-9,110*camera.z,19*camera.z,4);ctx.fill();ctx.stroke();ctx.fillStyle='#8491a7';ctx.font='9px ui-monospace,monospace';ctx.fillText(tail(n.label,16),p.x+5,p.y+3);addHit(n,p.x+45,p.y,55)})}ctx.restore()}
// 3D stack
function basePos(id){const h=hash(id),a=(h%6283)/1000,r=35+((h>>>8)%100)/100*150;return{x:Math.cos(a)*r,z:Math.sin(a)*r}}
function project(x,y,z){let cy=Math.cos(stackCam.yaw),sy=Math.sin(stackCam.yaw),cp=Math.cos(stackCam.pitch),sp=Math.sin(stackCam.pitch),rx=x*cy-z*sy,rz=x*sy+z*cy,ry=y*cp-rz*sp,depth=y*sp+rz*cp+650,scale=stackCam.zoom*630/depth;return{x:W/2+rx*scale,y:H/2+ry*scale,scale,depth}}
function planeCorners(y){return[[-250,y,-165],[250,y,-165],[250,y,165],[-250,y,165]].map(v=>project(...v))}function poly(ps){ctx.beginPath();ps.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath()}function stackLayout(){const gap=76,start=-(slices.length-1)*gap/2;return slices.map((s,i)=>({s,y:start+i*gap,corners:planeCorners(start+i*gap)}))}
function drawStack(){const layers=stackLayout().sort((a,b)=>b.corners.reduce((x,p)=>x+p.depth,0)-a.corners.reduce((x,p)=>x+p.depth,0));for(const [id,idxs0] of appearances)if(idxs0.length>1){const idxs=idxs0.map(id=>slices.findIndex(s=>s.id===id)).sort((a,b)=>a-b),bp=basePos(id);for(let k=1;k<idxs.length;k++)line(project(bp.x,(idxs[k-1]-(slices.length-1)/2)*76,bp.z),project(bp.x,(idxs[k]-(slices.length-1)/2)*76,bp.z),'#67e8f966',1.2)}for(const l of layers){const isH=hover?.plane===l.s.id;poly(l.corners);ctx.fillStyle=isH?'#233153c8':'#121a2aa0';ctx.strokeStyle=isH?'#a78bfa':'#55627b77';ctx.lineWidth=isH?2:1;ctx.fill();ctx.stroke();for(const e of l.s.edges){const aa=basePos(e.source),bb=basePos(e.target);line(project(aa.x,l.y,aa.z),project(bb.x,l.y,bb.z),'#75839b25')}const st=sliceStats.get(l.s.id);for(const n of l.s.nodes){const bp=basePos(n.id),p=project(bp.x,l.y,bp.z);ctx.fillStyle=C[n.kind]||C.default;if(!st.degree.get(n.id)){ctx.strokeStyle='#fb7185aa';ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.stroke()}ctx.beginPath();ctx.arc(p.x,p.y,2.1,0,Math.PI*2);ctx.fill()}const p=project(-268,l.y,-174);ctx.font='700 11px ui-monospace,monospace';ctx.fillStyle=isH?'#eee9ff':'#9ba8bf';ctx.fillText(l.s.name.toUpperCase(),p.x,p.y)}}
function pointInPoly(p,ps){let c=false;for(let i=0,j=ps.length-1;i<ps.length;j=i++)if(((ps[i].y>p.y)!==(ps[j].y>p.y))&&(p.x<(ps[j].x-ps[i].x)*(p.y-ps[i].y)/(ps[j].y-ps[i].y)+ps[i].x))c=!c;return c}
function draw(){hitAreas=[];ctx.clearRect(0,0,W,H);ctx.save();ctx.globalAlpha=fade;if(mode==='stack')drawStack();else if(mode==='packages')drawPackages();else if(mode==='files')drawFiles();else if(mode==='api')drawApi();else if(mode==='config')drawConfig();else if(mode==='tests')drawBipartite('tests',['test file'],['source file'],{leftTitle:'TEST FILES',rightTitle:'PRODUCTION FILES',uncovered:true});else if(mode==='external')drawBipartite('external',['http host','external api','retailer','marketplace','database'],['source file'],{leftTitle:'EXTERNAL SYSTEMS',rightTitle:'REFERENCING FILES'});ctx.restore();requestAnimationFrame(draw)}
function hitTest(){if(mode==='stack'){const h=[...stackLayout()].reverse().find(l=>pointInPoly(mouse,l.corners));hover=h?{plane:h.s.id,label:h.s.name}:null;return}hover=null;for(let i=hitAreas.length-1;i>=0;i--){const h=hitAreas[i];if(Math.hypot(mouse.x-h.x,mouse.y-h.y)<=h.r){hover=h.node;hover._connection=h.connection;break}}}
function tip(){if(!hover){tooltip.style.display='none';return}tooltip.style.display='block';tooltip.style.left=Math.max(5,Math.min(W-345,mouse.x+14))+'px';tooltip.style.top=Math.max(5,Math.min(H-90,mouse.y+14))+'px';if(mode==='stack'){const s=bySlice.get(hover.plane),st=sliceStats.get(s.id);tooltip.innerHTML=`<b>${s.name}</b><small>${st.nodes} nodes · ${st.edges} edges · ${st.orphans} orphans<br>Click to enter layer</small>`}else{const st=sliceStats.get(active.id),d=st.degree.get(hover.id)||0;tooltip.innerHTML=`<b>${hover.label}</b><small>${hover.kind} · ${d} direct connection${d===1?'':'s'}${d?'':' · ORPHAN'}<br>Click for inspector</small>`}}
function directConnections(id){const out=new Set();for(const s of slices)for(const e of s.edges){if(e.source===id)out.add(e.target);if(e.target===id)out.add(e.source)}if(mode==='api')for(const e of apiView.edges){if(e.source===id)out.add(e.target);if(e.target===id)out.add(e.source)}return[...out].map(x=>allNodes.get(x)).filter(Boolean).sort((a,b)=>a.label.localeCompare(b.label))}
function openInspector(n){selected=n;const con=directConnections(n.id),apps=appearances.get(n.id)||[];$('insKind').textContent=n.kind;$('insTitle').textContent=n.label;$('insBody').innerHTML=`<div class=ins-id>${n.id}</div><div class=ins-meta><span><b>${con.length}</b>direct links</span><span><b>${apps.length}</b>slices</span></div><div class=ins-section>DIRECT CONNECTIONS</div><div id=conns>${con.length?con.map(x=>`<button class=conn data-id="${encodeURIComponent(x.id)}">${x.label}</button>`).join(''):'<span style="color:#68758c;font-size:11px">No direct edges in the extracted graph</span>'}</div><div class=ins-section>ALSO APPEARS IN</div><div class=slicechips>${apps.map(id=>`<button class=chip data-slice="${id}">${bySlice.get(id).name}</button>`).join('')}</div>`;inspector.classList.add('open');inspector.querySelectorAll('.conn').forEach(b=>b.onclick=()=>jumpTo(decodeURIComponent(b.dataset.id)));inspector.querySelectorAll('.chip').forEach(b=>b.onclick=()=>setMode(b.dataset.slice))}
function closeInspector(){selected=null;inspector.classList.remove('open')}$('insClose').onclick=closeInspector;
function jumpTo(id){const n=allNodes.get(id);if(!n)return;const apps=appearances.get(id)||[];if(!apps.includes(mode)&&apps.length){setMode(apps[0]);setTimeout(()=>{const nn=allNodes.get(id);if(nn)openInspector(nn)},220)}else openInspector(n)}
function click(){if(mode==='stack'&&hover?.plane)setMode(hover.plane);else if(mode!=='stack'){if(hover)openInspector(hover);else closeInspector()}}
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse={x:e.clientX-r.left,y:e.clientY-r.top};if(drag){const dx=mouse.x-drag.x,dy=mouse.y-drag.y;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;if(mode==='stack'){stackCam.yaw+=dx*.006;stackCam.pitch=Math.max(.18,Math.min(1.2,stackCam.pitch+dy*.005))}else{camera.x+=dx/camera.z;camera.y+=dy/camera.z}drag.x=mouse.x;drag.y=mouse.y;canvas.classList.add('drag')}else{hitTest();tip()}});

canvas.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&drag){const t=e.touches[0],r=canvas.getBoundingClientRect();mouse={x:t.clientX-r.left,y:t.clientY-r.top};const dx=mouse.x-drag.x,dy=mouse.y-drag.y;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;if(mode==='stack'){stackCam.yaw+=dx*.006;stackCam.pitch=Math.max(.18,Math.min(1.2,stackCam.pitch+dy*.005))}else{camera.x+=dx/camera.z;camera.y+=dy/camera.z}drag.x=mouse.x;drag.y=mouse.y}else if(e.touches.length===2&&pinch){const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),f=d/pinch.d;pinch.d=d;if(mode==='stack')stackCam.zoom=Math.max(.42,Math.min(2.7,stackCam.zoom*f));else{camera.z=Math.max(.22,Math.min(4,camera.z*f));updateStats()}}},{passive:false});
